<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><iframe src="index.html" style="position:absolute;width:390px;height:844px;border:0" onload="const d=this.contentDocument; setTimeout(()=>{const w=390;const els=[...d.querySelectorAll('body *')].map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,cl:typeof e.className==='string'?e.className:'',x:r.x,w:r.width,r:r.right,txt:(e.innerText||'').trim().slice(0,60)}}).filter(o=>o.r>w+1||o.x< -1).sort((a,b)=>b.r-a.r);document.body.innerHTML='<pre>'+JSON.stringify({w,scrollWidth:d.documentElement.scrollWidth,items:els.slice(0,50)},null,2)+'</pre>'},1000)"></iframe>
